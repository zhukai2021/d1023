<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5ecd9">
<title>老黄历 · 每日黄历</title>
<style>
  :root{
    --bg:#f5ecd9; --card:#fffaf0; --ink:#3a2e1f; --sub:#8a7355;
    --red:#c0392b; --gold:#b8860b; --line:#e3d4b4; --green:#3f7d52;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #fbf4e4, transparent 60%),
      linear-gradient(180deg,#f5ecd9,#efe2c6);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:14px 12px 28px;
  }
  .app{width:100%; max-width:440px;}
  .title{text-align:center; margin:6px 0 12px;}
  .title h1{font-size:26px; letter-spacing:8px; margin:0; color:var(--red);
    font-weight:800; text-shadow:0 1px 0 #fff;}
  .title .ribbon{display:inline-block; font-size:12px; color:var(--sub);
    letter-spacing:3px; margin-top:4px;}

  .card{background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:16px; margin-bottom:12px;
    box-shadow:0 4px 14px rgba(120,90,40,.08);}

  .date-row{display:flex; align-items:center; justify-content:space-between;}
  .date-main{text-align:left;}
  .date-main .d-num{font-size:46px; font-weight:800; line-height:1; color:var(--ink);}
  .date-main .d-week{font-size:14px; color:var(--sub); margin-top:6px;}
  .date-main .d-full{font-size:12px; color:var(--sub); margin-top:2px;}
  .lunar-box{text-align:right; font-size:13px; color:var(--sub); line-height:1.7;}
  .lunar-box .ly{font-size:18px; color:var(--red); font-weight:700;}
  .lunar-box .sx{display:inline-block; margin-top:4px; font-size:13px;
    color:var(--gold); border:1px solid var(--gold); border-radius:20px;
    padding:1px 10px;}

  .gz{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .gz span{flex:1; min-width:0; text-align:center; background:#f3e8cf;
    border-radius:10px; padding:8px 4px; font-size:12px; color:var(--sub);}
  .gz span b{display:block; font-size:18px; color:var(--ink); font-weight:800; margin-top:2px;}

  .shen{text-align:center; margin:4px 0 2px;}
  .shen .big{font-size:40px; font-weight:800; color:var(--red); letter-spacing:4px;}
  .shen .tip{font-size:12px; color:var(--sub); margin-top:2px;}

  .yiji{display:flex; gap:10px; margin-top:12px;}
  .yiji .col{flex:1; border-radius:12px; padding:12px; text-align:left;}
  .yiji .yi{background:#eef6ee; border:1px solid #cfe6cf;}
  .yiji .ji{background:#fbeeee; border:1px solid #f0cccc;}
  .yiji h3{margin:0 0 8px; font-size:15px; letter-spacing:3px;}
  .yiji .yi h3{color:var(--green);}
  .yiji .ji h3{color:var(--red);}
  .yiji ul{margin:0; padding:0; list-style:none; line-height:1.9; font-size:14px;}
  .yiji li{padding-left:14px; position:relative;}
  .yiji li:before{position:absolute; left:0;}
  .yiji .yi li:before{content:"✓"; color:var(--green);}
  .yiji .ji li:before{content:"✕"; color:var(--red);}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px;}
  .grid .item{background:#f3e8cf; border-radius:10px; padding:10px;}
  .grid .item .k{font-size:11px; color:var(--sub); letter-spacing:2px;}
  .grid .item .v{font-size:14px; color:var(--ink); margin-top:3px; line-height:1.5;}

  .pz{font-size:13px; color:var(--ink); line-height:1.9; margin-top:8px;}
  .pz b{color:var(--red);}

  .foot{text-align:center; font-size:11px; color:var(--sub); margin-top:6px; letter-spacing:1px;}
  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .toolbar input[type=date]{flex:1; border:1px solid var(--line); border-radius:10px;
    padding:9px; font-size:14px; background:#fff; color:var(--ink); font-family:inherit;}
  .toolbar button{border:none; border-radius:10px; padding:0 16px; font-size:14px;
    background:var(--red); color:#fff; font-weight:700; cursor:pointer;}
  .toolbar button.ghost{background:#e3d4b4; color:var(--ink);}
</style>
</head>
<body>
<div class="app">
  <div class="title">
    <h1>老 黄 历</h1>
    <div class="ribbon">每 日 黄 历 · 自 动 更 新</div>
  </div>

  <div class="toolbar">
    <input type="date" id="picker">
    <button id="todayBtn" class="ghost">今天</button>
  </div>

  <div class="card">
    <div class="date-row">
      <div class="date-main">
        <div class="d-num" id="dNum">--</div>
        <div class="d-week" id="dWeek">--</div>
        <div class="d-full" id="dFull">--</div>
      </div>
      <div class="lunar-box">
        <div class="ly" id="lYear">--</div>
        <div id="lDate">--</div>
        <div class="sx" id="shengxiao">--</div>
      </div>
    </div>
    <div class="gz" id="gz"></div>
  </div>

  <div class="card">
    <div class="shen">
      <div class="big" id="zhiShen">--</div>
      <div class="tip" id="zhiShenTip">--</div>
    </div>
    <div class="yiji">
      <div class="col yi"><h3>宜</h3><ul id="yiList"></ul></div>
      <div class="col ji"><h3>忌</h3><ul id="jiList"></ul></div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="item"><div class="k">冲煞</div><div class="v" id="chong">--</div></div>
      <div class="item"><div class="k">五行</div><div class="v" id="wuxing">--</div></div>
      <div class="item"><div class="k">星座</div><div class="v" id="xingzuo">--</div></div>
      <div class="item"><div class="k">纳音</div><div class="v" id="nayin">--</div></div>
    </div>
    <div class="pz" id="pengzu">--</div>
  </div>

  <div class="foot">黄历内容依传统历法推算，仅供参考 · 行事仍须明辨</div>
</div>

<script>
/* ============ 农历数据（1900-2100） ============ */
const lunarInfo=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15173,0x052b0,0x0a9a8,
0x0e930,0x06d50,0x05aa0,0x0ada4,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a4,
0x0ea50,0x06b58,0x0a6d0,0x0ab60,0x09570,0x04af4,0x04970,0x064b0,0x074a5,0x0ea50,
0x06b58,0x0a6d0,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a4,0x0ea50,0x06b58,
0x0a6d0,0x0ab60,0x09570,0x04af4,0x04970,0x064b0,0x074a5,0x0ea50,0x06b58,0x0a6d0,
0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a4,0x0ea50,0x06b58,0x0a6d0,0x0ab60,
0x09570,0x04af4,0x04970,0x064b0,0x074a5,0x0ea50,0x06b58,0x0a6d0,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a4,0x0ea50,0x06b58,0x0a6d0,0x0ab60,0x09570,0x04af4,
0x04970,0x064b0,0x074a5,0x0ea50,0x06b58,0x0a6d0,0x0ab60,0x09570,0x04af5,0x04970,
0x064b0,0x074a4,0x0ea50,0x06b58,0x0a6d0,0x0ab60,0x09570,0x04af4,0x04970,0x064b0,
0x074a5,0x0ea50,0x06b58,0x0a6d0,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a4];

function lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+leapDays(y);}
function leapDays(y){return leapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0;}
function leapMonth(y){return lunarInfo[y-1900]&0xf;}
function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}

function solar2lunar(yy,mm,dd){
  const obj=new Date(yy,mm-1,dd), base=new Date(1900,0,31);
  let offset=Math.round((obj-base)/86400000);
  let ly=1900,temp=0;
  for(;ly<2101&&offset>0;ly++){temp=lYearDays(ly);offset-=temp;}
  if(offset<0){offset+=temp;ly--;}
  const lp=leapMonth(ly); let isLeap=false,lm;
  for(lm=1;lm<13&&offset>0;lm++){
    if(lp>0&&lm==(lp+1)&&!isLeap){lm--;isLeap=true;temp=leapDays(ly);}
    else{temp=monthDays(ly,lm);}
    if(isLeap&&lm==(lp+1))isLeap=false;
    offset-=temp;
  }
  if(offset==0&&lp>0&&lm==lp+1){if(isLeap){isLeap=false;}else{isLeap=true;lm--;}}
  if(offset<0){offset+=temp;lm--;}
  return {lYear:ly,lMonth:lm,lDay:offset+1,isLeap:isLeap};
}

/* ============ 干支 / 生肖 ============ */
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const SX=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
const WX=['木','木','火','火','土','土','金','金','水','水'];

function ganZhiDay(y,m,d){
  const base=new Date(1900,0,1),cur=new Date(y,m-1,d);
  const n=Math.round((cur-base)/86400000);
  return ((10+n)%60+60)%60; // 0-based, 1900-1-1 = 甲戌(10), 与 calendar.js 一致
}
function ganZhiYear(ly){return ((ly-4)%60+60)%60;}

/* ============ 建除十二神 + 宜忌 ============ */
const JIANCHU=['建','除','满','平','定','执','破','危','成','收','开','闭'];
const JC_YI=[
  ['出行','嫁娶','动土','祭祀','祈福','求嗣'],
  ['祭祀','祈福','解除','沐浴','疗病','出行'],
  ['祭祀','祈福','开市','交易','立券','纳财'],
  ['修造','嫁娶','安床','出行','求医','栽种'],
  ['祭祀','祈福','嫁娶','造屋','纳财','安床'],
  ['造屋','修造','收购','纳财','捕捉','栽种'],
  ['破屋','坏垣','求医','治病','疗疾'],
  ['安床','祭祀','祈福','捕捉','纳财','结网'],
  ['嫁娶','开市','入学','动土','出行','纳财'],
  ['纳财','收藏','嫁娶','祭祀','捕捉','纳畜'],
  ['祭祀','祈福','入学','开市','出行','纳财'],
  ['筑堤','埋穴','补垣','开厕','安葬','纳畜']
];
const JC_JI=[
  ['动土','开仓','安葬','移徙'],
  ['求官','上任','远行','出行'],
  ['动土','安葬','开仓','诉讼'],
  ['词讼','出行','交涉','安床'],
  ['词讼','出行','交涉','开仓'],
  ['开市','移徙','出行','入宅'],
  ['诸事不宜','嫁娶','出行','动土'],
  ['登高','出行','乘船','移徙'],
  ['词讼','出行','交涉','安葬'],
  ['放债','出行','安葬','开市'],
  ['安葬','放债','动土','词讼'],
  ['开市','出行','求医','移徙']
];

/* ============ 冲煞 ============ */
const CHONG_SX=['午','未','申','酉','戌','亥','子','丑','寅','卯','辰','巳']; // 日支冲的生肖
const SHA=[['南','申子辰'],['西','亥卯未'],['北','寅午戌'],['东','巳酉丑']];

/* ============ 纳音五行（60甲子） ============ */
const NAYIN=[
'海中金','海中金','炉中火','炉中火','大林木','大林木','路旁土','路旁土','剑锋金','剑锋金',
'山头火','山头火','涧下水','涧下水','城头土','城头土','白蜡金','白蜡金','杨柳木','杨柳木',
'泉中水','泉中水','霹雳火','霹雳火','屋上土','屋上土','石榴木','石榴木','桑柘木','桑柘木',
'大溪水','大溪水','沙中土','沙中土','天上火','天上火','钗钏金','钗钏金','钗钏金','钗钏金',
'大海水','大海水','海中金','海中金','炉中火','炉中火','大林木','大林木','路旁土','路旁土',
'剑锋金','剑锋金','山头火','山头火','涧下水','涧下水','城头土','城头土','白蜡金','白蜡金',
'杨柳木','杨柳木','泉中水','泉中水','霹雳火','霹雳火','屋上土','屋上土','石榴木','石榴木'
];

/* ============ 彭祖百忌 ============ */
const PZ_GAN=['甲不开仓财物耗散','乙不栽植千株不长','丙不修灶必见灾殃','丁不剃头头必生疮',
'戊不受田田主不祥','己不破券二比并亡','庚不经络织机虚张','辛不合酱主人不尝',
'壬不汲水更难提防','癸不词讼理弱敌强'];
const PZ_ZHI=['子不问卜自惹祸殃','丑不冠带主不还乡','寅不祭祀神鬼不尝','卯不穿井水泉不香',
'辰不哭泣必主重丧','巳不远行财物伏藏','午不苫盖屋主更张','未不服药毒气入肠',
'申不安床鬼祟入房','酉不会客醉坐颠狂','戌不吃犬作怪上床','亥不嫁娶不利新郎'];

/* ============ 农历月 / 日名 ============ */
const LM=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LD=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
'十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
'廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const WEEK=['日','一','二','三','四','五','六'];
const XZ=['摩羯','水瓶','双鱼','白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯'];

function getXingzuo(m,d){
  const e=[20,19,21,20,21,22,23,23,23,24,23,22];
  return (d<e[m-1])?XZ[m-1]:XZ[m%12];
}

function pad(n){return n<10?'0'+n:''+n;}

function render(y,m,d){
  const l=solar2lunar(y,m,d);
  const gy=ganZhiYear(l.lYear);
  const daySeq=ganZhiDay(y,m,d);
  const dg=daySeq%10, dz=daySeq%12;

  // 公历
  document.getElementById('dNum').textContent=d;
  document.getElementById('dWeek').textContent='星期'+WEEK[new Date(y,m-1,d).getDay()];
  document.getElementById('dFull').textContent=y+' 年 '+m+' 月 '+d+' 日';

  // 农历
  document.getElementById('lYear').textContent=GAN[gy%10]+ZHI[gy%12]+'年';
  document.getElementById('lDate').textContent=(l.isLeap?'闰':'')+LM[l.lMonth-1]+'月 '+LD[l.lDay-1];
  document.getElementById('shengxiao').textContent='生肖 '+SX[gy%12];

  // 干支
  const lMonthGan=((gy%10)*2+2 + (l.lMonth-1))%10;
  const lMonthZhi=(2+(l.lMonth-1))%12;
  const gz=document.getElementById('gz');
  gz.innerHTML=
    `<span>年干支<b>${GAN[gy%10]}${ZHI[gy%12]}</b></span>`+
    `<span>月干支<b>${GAN[lMonthGan]}${ZHI[lMonthZhi]}</b></span>`+
    `<span>日干支<b>${GAN[dg]}${ZHI[dz]}</b></span>`;

  // 建除十二神：月建地支(正月=寅=2)，值神=(日支-月建+12)%12
  const monthZhi=(2+(l.lMonth-1))%12; // 0-based 地支
  const idx=((dz-monthZhi)%12+12)%12;
  const shen=JIANCHU[idx];
  document.getElementById('zhiShen').textContent=shen;
  document.getElementById('zhiShenTip').textContent='当日值神 · '+shen+'日';

  const yiL=document.getElementById('yiList'), jiL=document.getElementById('jiList');
  yiL.innerHTML=JC_YI[idx].map(x=>`<li>${x}</li>`).join('');
  jiL.innerHTML=JC_JI[idx].map(x=>`<li>${x}</li>`).join('');

  // 冲煞：日支冲生肖 + 煞方
  const cSX=CHONG_SX[dz];
  const sha=SHA[dz%4][0];
  document.getElementById('chong').textContent='冲'+cSX+'（'+ZHI[dz]+'）煞'+sha;

  // 五行（日干）
  document.getElementById('wuxing').textContent=WX[dg]+'（日干）';

  // 星座
  document.getElementById('xingzuo').textContent=getXingzuo(m,d);

  // 纳音（日干支）
  document.getElementById('nayin').textContent=NAYIN[daySeq];

  // 彭祖百忌
  document.getElementById('pengzu').innerHTML=
    '<b>彭祖百忌：</b>'+PZ_GAN[dg]+'；'+PZ_ZHI[dz];
}

function setToday(){
  const t=new Date();
  const y=t.getFullYear(),m=t.getMonth()+1,d=t.getDate();
  const picker=document.getElementById('picker');
  picker.value=`${y}-${pad(m)}-${pad(d)}`;
  render(y,m,d);
}

document.getElementById('picker').addEventListener('change',function(){
  if(!this.value)return;
  const [y,m,d]=this.value.split('-').map(Number);
  render(y,m,d);
});
document.getElementById('todayBtn').addEventListener('click',setToday);

setToday();
</script>
</body>
</html>
