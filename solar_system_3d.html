<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系 3D 模型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Microsoft YaHei', sans-serif; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #info {
            position: fixed; top: 20px; left: 20px; color: #fff; z-index: 100;
            background: rgba(0,0,0,0.55); padding: 14px 18px; border-radius: 10px;
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
        }
        #info h1 { margin: 0 0 8px 0; font-size: 17px; color: #ffcc00; }
        #info ul { list-style: none; font-size: 12px; line-height: 1.9; color: #ccc; }
        #info li span { color: #ffcc00; }
        #controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 100;
        }
        button {
            padding: 9px 18px; background: rgba(52,152,219,0.85); color: #fff;
            border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
            transition: all 0.2s; backdrop-filter: blur(4px);
        }
        button:hover { background: rgba(93,173,226,0.95); transform: scale(1.04); }
        button.active { background: rgba(231,76,60,0.85); }
        .legend {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex; flex-direction: column; gap: 6px;
        }
        .legend-item {
            display: flex; align-items: center; color: #eee; font-size: 11px;
            background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 5px;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.06);
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; border: 1px solid rgba(255,255,255,0.3); }
        #loading {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #ccc; font-size: 15px; z-index: 200; background: #000;
        }
        #loading.hidden { display: none; }
    </style>
</head>
<body>
    <div id="loading">⏳ 正在加载 3D 场景...</div>
    <div id="info">
        <h1>🌌 太阳系 3D</h1>
        <ul>
            <li><span>🖱️</span> 左键拖拽旋转视角</li>
            <li><span>🔍</span> 右键拖拽平移</li>
            <li><span>🔁</span> 滚轮缩放</li>
            <li><span>🎮</span> 下方按钮控制播放/速度/轨道</li>
        </ul>
    </div>
    <div class="legend">
        <div class="legend-item"><span class="dot" style="background: radial-gradient(circle,#fff 30%,#ff8c00 70%,#ff6600);"></span>太阳</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#ffecb3,#ff5722);"></span>水星</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#ffcc80,#ff9800);"></span>金星</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#4aa3ff,#0b5fb0);"></span>地球</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#ffcae8,#c2185b);"></span>火星</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#e8b98b,#a05a2c);"></span>木星</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#f3e5f5,#b08a5a);"></span>土星</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#bde6f5,#3c93b5);"></span>天王星</div>
        <div class="legend-item"><span class="dot" style="background: linear-gradient(#8aa7ff,#3b5bd6);"></span>海王星</div>
    </div>
    <div id="controls">
        <button id="pauseBtn">暂停</button>
        <button id="speedBtn">加速 ×1</button>
        <button id="orbitBtn">隐藏轨道</button>
    </div>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function () {
            'use strict';

            let scene, camera, renderer, controls;
            let sunMesh;            // 全局太阳引用（不再遮蔽）
            const planets = [];

            let isPaused = false;
            let speedMul = 1;
            let showOrbits = true;
            let time = 0;

            // ============ 行星数据 ============
            const PLANET_DATA = [
                { name: '水星', distance: 42, radius: 4,  color: 0xc7a27a, speed: 0.09 },
                { name: '金星', distance: 58, radius: 7,  color: 0xe8b06a, speed: 0.05 },
                { name: '地球', distance: 78, radius: 8,  color: 0x4a9fe8, speed: 0.035, hasMoon: true },
                { name: '火星', distance: 98, radius: 6,  color: 0xd1604a, speed: 0.028 },
                { name: '木星', distance: 135, radius: 18, color: 0xc99b6d, speed: 0.016, stripes: true },
                { name: '土星', distance: 175, radius: 15, color: 0xd9b98c, speed: 0.012, hasRing: true },
                { name: '天王星', distance: 215, radius: 11, color: 0x8fd3e8, speed: 0.008 },
                { name: '海王星', distance: 255, radius: 10, color: 0x5b7bd6, speed: 0.006 }
            ];

            function init() {
                const canvas = document.getElementById('canvas');
                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
                camera.position.set(220, 160, 280);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({
                    canvas: canvas,
                    antialias: true,
                    alpha: false
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                createLights();
                createStars();
                createSun();
                PLANET_DATA.forEach(createPlanet);

                // 使用 OrbitControls（简易版，避免外部依赖文件）
                initControls(camera, canvas);

                window.addEventListener('resize', onWindowResize);
                document.getElementById('pauseBtn').addEventListener('click', togglePause);
                document.getElementById('speedBtn').addEventListener('click', toggleSpeed);
                document.getElementById('orbitBtn').addEventListener('click', toggleOrbits);

                // 隐藏加载遮罩
                document.getElementById('loading').classList.add('hidden');
                animate();
            }

            // ============ 光源（黑屏修复关键） ============
            function createLights() {
                const ambient = new THREE.AmbientLight(0x404060, 0.9);
                scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
                dirLight.position.set(80, 60, 50);
                scene.add(dirLight);

                // 从太阳位置发出的点光源，给行星照亮
                const pointLight = new THREE.PointLight(0xffcc88, 1.4, 800, 2);
                pointLight.position.set(0, 0, 0);
                scene.add(pointLight);
            }

            // ============ 星空背景 ============
            function createStars() {
                const starGeo = new THREE.BufferGeometry();
                const count = 9000;
                const pos = new Float32Array(count * 3);
                for (let i = 0; i < count * 3; i += 3) {
                    const r = 1200 + Math.random() * 900;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    pos[i]     = r * Math.sin(phi) * Math.cos(theta);
                    pos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                    pos[i + 2] = r * Math.cos(phi);
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const starMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 2.2,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.85
                });
                scene.add(new THREE.Points(starGeo, starMat));
            }

            // ============ 太阳（MeshBasicMaterial 自发光，不依赖光照） ============
            function createSun() {
                const geo = new THREE.SphereGeometry(26, 48, 48);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });
                sunMesh = new THREE.Mesh(geo, mat);
                scene.add(sunMesh);

                // 太阳光晕贴图
                const glowCanvas = document.createElement('canvas');
                glowCanvas.width = 256;
                glowCanvas.height = 256;
                const ctx = glowCanvas.getContext('2d');
                const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                grad.addColorStop(0, 'rgba(255,190,80,0.9)');
                grad.addColorStop(0.3, 'rgba(255,150,40,0.45)');
                grad.addColorStop(0.7, 'rgba(255,110,20,0.12)');
                grad.addColorStop(1, 'rgba(255,90,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 256, 256);

                const glowTex = new THREE.CanvasTexture(glowCanvas);
                const glowMat = new THREE.SpriteMaterial({
                    map: glowTex,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false
                });
                const glow = new THREE.Sprite(glowMat);
                glow.scale.set(160, 160, 1);
                scene.add(glow);
            }

            // ============ 行星 + 轨道 + 卫星/环 ============
            function createPlanet(data) {
                let geo, mat;
                if (data.stripes) {
                    // 木星：条纹环带
                    geo = new THREE.SphereGeometry(data.radius, 40, 40);
                    const stripeCanvas = document.createElement('canvas');
                    stripeCanvas.width = 512; stripeCanvas.height = 128;
                    const ctx = stripeCanvas.getContext('2d');
                    const palette = ['#c99b6d', '#b8875a', '#d8b088', '#a06a3d', '#c99b6d', '#b8875a'];
                    for (let i = 0; i < palette.length; i++) {
                        ctx.fillStyle = palette[i];
                        ctx.fillRect(0, i * 22, 512, 22);
                    }
                    const stripeTex = new THREE.CanvasTexture(stripeCanvas);
                    mat = new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.9 });
                } else {
                    geo = new THREE.SphereGeometry(data.radius, 32, 32);
                    mat = new THREE.MeshStandardMaterial({
                        color: data.color,
                        roughness: 0.85,
                        metalness: 0.05
                    });
                }

                const mesh = new THREE.Mesh(geo, mat);
                const angle = Math.random() * Math.PI * 2;
                mesh.position.set(
                    data.distance * Math.cos(angle),
                    0,
                    data.distance * Math.sin(angle)
                );
                scene.add(mesh);

                // 土星环
                if (data.hasRing) {
                    const ringGeo = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.3, 64);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: 0xd9b98c,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.8
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2.4;
                    mesh.add(ring);
                }

                // 地球卫星
                if (data.hasMoon) {
                    const moonGeo = new THREE.SphereGeometry(2.2, 16, 16);
                    const moonMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
                    const moon = new THREE.Mesh(moonGeo, moonMat);
                    moon.userData = { orbitAngle: 0 };
                    mesh.add(moon);
                    mesh.userData.moon = moon;
                }

                // 轨道线
                const orbitGeo = new THREE.RingGeometry(
                    data.distance - 0.25,
                    data.distance + 0.25,
                    96
                );
                const orbitMat = new THREE.MeshBasicMaterial({
                    color: 0x6a7a8a,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.35
                });
                const orbit = new THREE.Mesh(orbitGeo, orbitMat);
                orbit.rotation.x = -Math.PI / 2;
                scene.add(orbit);

                planets.push({
                    mesh: mesh,
                    orbit: orbit,
                    data: data,
                    angle: angle
                });
            }

            // ============ 简易轨道控制器（不依赖额外文件） ============
            function initControls(cameraObj, domElement) {
                var spherical = { theta: Math.atan2(cameraObj.position.x, cameraObj.position.z), phi: Math.acos(cameraObj.position.y / cameraObj.position.length()), radius: cameraObj.position.length() };
                var dragging = false, lastX = 0, lastY = 0, lastPinch = 0;

                domElement.addEventListener('mousedown', function (e) {
                    if (e.button === 2 || e.button === 1 || e.button === 0) {
                        dragging = true;
                        lastX = e.clientX; lastY = e.clientY;
                    }
                });
                window.addEventListener('mouseup', function () { dragging = false; });
                domElement.addEventListener('mousemove', function (e) {
                    if (!dragging) return;
                    var dx = e.clientX - lastX;
                    var dy = e.clientY - lastY;
                    lastX = e.clientX; lastY = e.clientY;
                    spherical.theta -= dx * 0.005;
                    spherical.phi -= dy * 0.005;
                    spherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, spherical.phi));
                    updateCamera();
                });
                domElement.addEventListener('contextmenu', function (e) { e.preventDefault(); });
                domElement.addEventListener('wheel', function (e) {
                    e.preventDefault();
                    spherical.radius *= (e.deltaY > 0 ? 1.08 : 0.93);
                    spherical.radius = Math.max(40, Math.min(1200, spherical.radius));
                    updateCamera();
                }, { passive: false });

                function updateCamera() {
                    var sinPhi = Math.sin(spherical.phi);
                    cameraObj.position.set(
                        spherical.radius * sinPhi * Math.sin(spherical.theta),
                        spherical.radius * Math.cos(spherical.phi),
                        spherical.radius * sinPhi * Math.cos(spherical.theta)
                    );
                    cameraObj.lookAt(0, 0, 0);
                }
            }

            // ============ 动画循环 ============
            function animate() {
                requestAnimationFrame(animate);
                if (!isPaused) {
                    time += 0.008 * speedMul;
                    if (sunMesh) sunMesh.rotation.y += 0.004 * speedMul;

                    planets.forEach(function (p) {
                        p.angle += p.data.speed * speedMul;
                        p.mesh.position.x = p.data.distance * Math.cos(p.angle);
                        p.mesh.position.z = p.data.distance * Math.sin(p.angle);
                        p.mesh.rotation.y += 0.01 * speedMul;

                        // 月球绕地球
                        if (p.data.hasMoon && p.mesh.userData.moon) {
                            var moon = p.mesh.userData.moon;
                            moon.position.x = 13 * Math.cos(time * 2);
                            moon.position.z = 13 * Math.sin(time * 2);
                        }
                    });
                }
                renderer.render(scene, camera);
            }

            // ============ UI ============
            function togglePause() {
                isPaused = !isPaused;
                document.getElementById('pauseBtn').textContent = isPaused ? '继续' : '暂停';
            }
            function toggleSpeed() {
                speedMul = speedMul === 1 ? 5 : (speedMul === 5 ? 15 : 1);
                document.getElementById('speedBtn').textContent = '加速 ×' + speedMul;
            }
            function toggleOrbits() {
                showOrbits = !showOrbits;
                planets.forEach(function (p) {
                    p.orbit.visible = showOrbits;
                });
                document.getElementById('orbitBtn').textContent = showOrbits ? '隐藏轨道' : '显示轨道';
            }
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // 启动
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                window.addEventListener('DOMContentLoaded', init);
            }
        })();
    </script>
</body>
</html>
