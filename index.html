}

function startPlay(){
  finished=0;if(!playing){playing=1;B.textContent="\u23F8";ST.textContent="\u64AD\u653E\u4E2D...";playSegment(idx);if(!anim)drawLoop()}
}

function stopPlay(){
  finished=1;playing=0;if(src){try{src.stop()}catch(e){}src=null}
  B.textContent="\u25B6";ST.textContent="\u23F8 \u5DF2\u6682\u505C";
}

function togglePlay(){
  if(playing)stopPlay();
  else{if(idx>=S.length-1){idx=0;PB.style.width="0%"}startPlay()}
}

function replayAll(){
  stopPlay();setTimeout(function(){idx=0;PB.style.width="0%";startPlay()},100)
}

B.onclick=togglePlay;R.onclick=replayAll;

// Preload cover immediately
loadAudio("cover",function(){ST.textContent="\u2714 \u53EF\u64AD\u653E"});for(var j=1;j<S.length;j++)loadAudio(S[j].id);
// Preload rest


function drawBg(){
  var g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a0a1a");g.addColorStop(0.5,"#1a1a3e");g.addColorStop(1,"#0a0a1a");
  X.fillStyle=g;X.fillRect(0,0,W,H)
}

function drawFrame(){
  X.clearRect(0,0,W,H);drawBg();updP();drawP();
  var g=S[idx]||S[0],cx=W/2,cy=H/2,t=performance.now()/1000;

  if(g.id==="cover"){
    var s=1+Math.sin(t*3)*0.05;
    X.save();
    X.shadowColor="#667eea60";X.shadowBlur=40;
    X.beginPath();X.arc(cx,260,65*s,0,Math.PI*2);
    X.fillStyle="#667eea30";X.fill();X.strokeStyle="#667eea80";X.lineWidth=2;X.stroke();
    X.shadowBlur=0;X.font='60px "Segoe UI Emoji",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillText("\uD83D\uDCE1",cx,260);X.restore();
    X.save();X.shadowColor="rgba(0,0,0,0.5)";X.shadowBlur=15;
    X.font='bold 36px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillStyle="#fff";X.fillText("\u4ECA\u65E5\u79D1\u6280\u65B0\u95FB",cx,370);X.restore();
    X.save();X.font='20px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillStyle="rgba(255,255,255,0.6)";X.fillText("2026\u5E748\u67086\u65E5",cx,420);X.restore();
    X.save();X.font='16px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";
    X.fillStyle="rgba(255,255,255,0.4)";X.fillText("\u79D1\u6280\u65E5\u62A5\u00B7\u6BCF\u65E5\u7CBE\u9009",cx,460);X.restore();
  }else if(g.id==="outro"){
    X.save();X.shadowColor="rgba(0,0,0,0.5)";X.shadowBlur=15;
    X.font='bold 32px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillStyle="#fff";X.fillText("\u611F\u8C22\u60A8\u7684\u6536\u770B",cx,cy-40);X.restore();
    X.save();X.font='18px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillStyle="rgba(255,255,255,0.5)";X.fillText("\u660E\u65E5\u518D\u89C1",cx,cy+20);X.restore();
    var pa=Math.sin(t*4)*0.3+0.7;
    X.save();X.globalAlpha=pa;X.font='14px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";
    X.fillStyle="rgba(255,255,255,0.2)";X.fillText("\uD83D\uDCFA \u79D1\u6280\u65E5\u62A5 \u00B7 \u6BCF\u65E5\u79D1\u6280\u65B0\u95FB",cx,cy+100);X.restore();
  }else{
    var g2=X.createRadialGradient(cx,cy-140,10,cx,cy-140,200);
    g2.addColorStop(0,g.color+"30");g2.addColorStop(1,"transparent");
    X.fillStyle=g2;X.fillRect(0,0,W,H);
    X.save();X.shadowColor=g.color+"60";X.shadowBlur=25;
    X.beginPath();X.arc(cx,cy-140,39,0,Math.PI*2);X.fillStyle=g.color+"20";X.fill();
    X.shadowBlur=0;X.beginPath();X.arc(cx,cy-140,37,0,Math.PI*2);X.fillStyle=g.color+"30";X.fill();
    X.strokeStyle=g.color+"60";X.lineWidth=2;X.stroke();X.restore();
    X.save();X.font='38px "Segoe UI Emoji",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillText(g.icon,cx,cy-140);X.restore();
    X.save();X.shadowColor="rgba(0,0,0,0.5)";X.shadowBlur=10;
    X.font='bold 26px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillStyle="#fff";X.fillText(g.title,cx,cy-20);X.restore();
    var lw=50+Math.sin(t*3)*8;
    X.save();X.strokeStyle=g.color+"80";X.lineWidth=2;X.shadowColor=g.color+"40";X.shadowBlur=8;
    X.beginPath();X.moveTo(cx-lw/2,cy+15);X.lineTo(cx+lw/2,cy+15);X.stroke();X.restore();
    X.save();X.font='17px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";X.textBaseline="middle";
    X.fillStyle="rgba(255,255,255,0.85)";X.shadowColor="rgba(0,0,0,0.3)";X.shadowBlur=5;
    g.desc.split("\n").forEach(function(l,i){X.fillText(l,cx,cy+60+i*28)});X.restore();
    X.save();X.font='13px "Microsoft YaHei","PingFang SC",sans-serif';X.textAlign="center";X.fillStyle="rgba(255,255,255,0.3)";
    X.fillText(idx+"/"+(S.length-2),cx,H-155);X.restore();
    S.slice(1,-1).forEach(function(_,j){
      X.save();X.beginPath();X.arc(cx+(j-(S.length-3)/2)*18+9,H-125,4,0,Math.PI*2);
      X.fillStyle=j===idx-1?g.color:"rgba(255,255,255,0.2)";
      X.shadowColor=j===idx-1?g.color+"60":"transparent";X.shadowBlur=j===idx-1?10:0;X.fill();X.restore()
    });
  }

  // Progress bar
  var e=0;for(var j=0;j<idx;j++)e+=D[j];
  PB.style.width=Math.min(e/TOT*100,100)+"%";

  X.save();X.font='12px monospace';X.fillStyle="rgba(255,255,255,0.3)";X.textAlign="center";
  X.fillText((idx+1)+"/"+S.length,W/2,H-30);X.restore();
  anim=requestAnimationFrame(drawFrame)
}

drawFrame();
</script>
</body>
</html>
