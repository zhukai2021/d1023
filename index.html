<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓库文件 · d1023</title>
<style>
  :root { --fg:#1f2328; --muted:#8a929b; --line:#e4e7eb; --bg:#ffffff; --accent:#2f6feb; --soft:#f5f8ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, Roboto, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .status { color: var(--muted); font-size: 13px; margin: 0 0 18px; min-height: 18px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 11px 8px; border-bottom: 1px solid var(--line); font-size: 15px;
    transition: background .15s;
  }
  li:hover { background: var(--soft); }
  .name { word-break: break-all; }
  .name a { color: var(--fg); text-decoration: none; }
  .name a:hover { color: var(--accent); text-decoration: underline; }
  .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dir { color: var(--accent); }
  .err { color: #d1242f; }
</style>
</head>
<body>
<div class="wrap">
  <h1>仓库文件清单</h1>
  <p class="sub">zhukai2021/d1023 · 动态加载，新增文件自动显示</p>
  <p class="status" id="status">加载中…</p>
  <ul id="list"></ul>
</div>
<script>
const REPO = "zhukai2021/d1023";
const CONTENTS = "https://api.github.com/repos/" + REPO + "/contents";
const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");

// 递归列出所有文件（含子目录）
async function listAll(path) {
  const res = await fetch(CONTENTS + (path ? "/" + path : ""));
  if (!res.ok) throw new Error("HTTP " + res.status + " 获取文件列表失败");
  const items = await res.json();
  let files = [];
  for (const it of items) {
    if (it.type === "dir") files = files.concat(await listAll(it.path));
    else files.push(it);
  }
  return files;
}

// 取文件最近一次提交时间
async function mtime(path) {
  try {
    const r = await fetch("https://api.github.com/repos/" + REPO + "/commits?path=" + encodeURIComponent(path) + "&per_page=1");
    if (!r.ok) return "";
    const j = await r.json();
    const c = j[0] && j[0].commit;
    if (!c) return "";
    return (c.committer && c.committer.date) || (c.author && c.author.date) || "";
  } catch (e) { return ""; }
}

function fmt(d) {
  if (!d) return "";
  const t = new Date(d), p = n => String(n).padStart(2, "0");
  return t.getFullYear() + "-" + p(t.getMonth() + 1) + "-" + p(t.getDate()) + " " + p(t.getHours()) + ":" + p(t.getMinutes());
}

(async () => {
  try {
    let files = await listAll();
    files.sort((a, b) => a.path.localeCompare(b.path));
    statusEl.textContent = "共 " + files.length + " 个文件（实时来自 GitHub）";
    const times = await Promise.all(files.map(f => mtime(f.path)));
    files.forEach((f, i) => {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.className = "name";
      const a = document.createElement("a");
      a.href = f.path;                  // 相对路径：在 GitHub Pages 站点内打开对应文件
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = f.path;
      name.appendChild(a);
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = fmt(times[i]);
      li.appendChild(name);
      li.appendChild(time);
      listEl.appendChild(li);
    });
  } catch (e) {
    statusEl.innerHTML = '<span class="err">加载失败：' + e.message +
      '（若为私有仓库或 GitHub API 限流，请稍后重试；也可配置带 token 的构建脚本）</span>';
  }
})();
</script>
</body>
</html>
