<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CASIO fx-991CN X · 科学计算器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 16px;
        }
        
        .calculator {
            width: 340px;
            background: linear-gradient(145deg, #2a2a3a 0%, #1e1e2e 100%);
            border-radius: 24px;
            padding: 20px 16px 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
        }
        
        /* Brand */
        .brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .brand-name { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 2px; }
        .brand-model { font-size: 8px; color: #888; letter-spacing: 1px; }
        .brand-badge { background: linear-gradient(135deg, #00d4ff, #0090ff); color: #fff; font-size: 7px; padding: 2px 6px; border-radius: 3px; }
        
        /* Solar Panel */
        .solar-panel {
            height: 24px;
            background: linear-gradient(180deg, #1a1a3a, #0d0d20);
            border-radius: 4px;
            margin-bottom: 12px;
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .solar-cell { flex: 1; border-right: 1px solid rgba(255,255,255,0.03); background: linear-gradient(180deg, #1e1e4a, #12123a); }
        .solar-cell:last-child { border-right: none; }
        
        /* Display */
        .display {
            background: linear-gradient(180deg, #0a1628, #0d1f35);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }
        .display-mode { display: flex; gap: 8px; margin-bottom: 4px; }
        .mode-tag { font-size: 9px; color: #00d4ff; font-weight: 600; }
        .mode-tag.off { color: #3a5a7a; }
        .display-expr {
            min-height: 22px;
            font-size: 13px;
            color: #5a8aaa;
            text-align: right;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
            white-space: nowrap;
        }
        .display-result {
            font-size: 30px;
            font-weight: 300;
            color: #fff;
            text-align: right;
            font-family: 'Courier New', monospace;
            min-height: 38px;
            text-shadow: 0 0 15px rgba(0,200,255,0.4);
            overflow-x: auto;
            white-space: nowrap;
        }
        .display-result.error { color: #ff6b6b; font-size: 18px; }
        
        /* Button Grid - 5列布局 */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        
        /* 按钮基础样式 */
        .btn {
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            font-family: inherit;
            user-select: none;
        }
        .btn:active { transform: scale(0.93); }
        
        /* 功能键 - 深色 */
        .btn-func {
            background: linear-gradient(180deg, #3a3a5a, #2a2a4a);
            color: #a0a0c0;
            font-size: 11px;
        }
        
        /* 数字键 - 浅色 */
        .btn-num {
            background: linear-gradient(180deg, #e8e8f0, #d0d0e0);
            color: #1a1a2e;
            font-size: 17px;
            font-weight: 600;
        }
        
        /* 运算符 - 蓝色 */
        .btn-op {
            background: linear-gradient(180deg, #4a90d9, #357abd);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }
        
        /* 等号 - 亮蓝 */
        .btn-eq {
            background: linear-gradient(180deg, #00d4ff, #0090ff);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }
        
        /* 清空 - 红色 */
        .btn-clear {
            background: linear-gradient(180deg, #ff6b6b, #e04545);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }
        
        /* Shift键 - 黄色 */
        .btn-shift {
            background: linear-gradient(180deg, #e8c547, #d4a830);
            color: #1a1a2e;
            font-weight: 700;
            font-size: 10px;
        }
        
        /* Alpha键 - 红色 */
        .btn-alpha {
            background: linear-gradient(180deg, #ff6b6b, #e04545);
            color: #fff;
            font-weight: 700;
            font-size: 10px;
        }
        
        /* 导航键 */
        .btn-nav {
            background: linear-gradient(180deg, #4a4a6a, #3a3a5a);
            color: #fff;
            font-size: 10px;
        }
        
        /* 子标签 */
        .btn-inner { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .sub-label { font-size: 7px; color: #e8c547; line-height: 1; }
        
        /* 响应式 */
        @media (max-height: 700px) { .calculator { transform: scale(0.9); } }
        @media (max-height: 600px) { .calculator { transform: scale(0.8); } }
        @media (max-width: 360px) {
            .calculator { width: 300px; padding: 14px 10px 18px; }
            .btn { min-height: 34px; font-size: 11px; }
            .btn-num, .btn-op { font-size: 14px; }
            .display-result { font-size: 24px; }
        }
        
        /* 结果发光动画 */
        @keyframes glow { 0%,100% { text-shadow: 0 0 15px rgba(0,200,255,0.4); } 50% { text-shadow: 0 0 25px rgba(0,200,255,0.7); } }
        .display-result { animation: glow 3s ease-in-out infinite; }
    </style>
</head>
<body>
<div class="calculator">
    <div class="brand">
        <div>
            <div class="brand-name">CASIO</div>
            <div class="brand-model">fx-991CN X</div>
        </div>
        <div class="brand-badge">NATURAL-V.P.A.M.</div>
    </div>
    
    <div class="solar-panel">
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
    </div>
    
    <div class="display">
        <div class="display-mode">
            <span class="mode-tag" id="modeTag">COMP</span>
            <span class="mode-tag off" id="shiftTag">S</span>
            <span class="mode-tag off" id="degRadTag">DEG</span>
        </div>
        <div class="display-expr" id="expression"></div>
        <div class="display-result" id="result">0</div>
    </div>
    
    <div class="btn-grid">
        <!-- Row 1: Shift, Alpha, Nav -->
        <button class="btn btn-shift" onclick="toggleShift()">SHIFT</button>
        <button class="btn btn-alpha">ALPHA</button>
        <button class="btn btn-nav">▲</button>
        <button class="btn btn-nav">◄</button>
        <button class="btn btn-nav">►</button>
        
        <!-- Row 2: 科学函数 -->
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">a/b</span><span>✿</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">∛</span><span>√□</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">x³</span><span>x²</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">ˣ√</span><span>xʸ</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">10ˣ</span><span>log</span></div></button>
        
        <!-- Row 3: 更多函数 -->
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">eˣ</span><span>ln</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">sin⁻¹</span><span>sin</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">cos⁻¹</span><span>cos</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">tan⁻¹</span><span>tan</span></div></button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">x!</span><span>1/x</span></div></button>
        
        <!-- Row 4: 辅助功能 -->
        <button class="btn btn-func">|x|</button>
        <button class="btn btn-func">( )</button>
        <button class="btn btn-func"><div class="btn-inner"><span class="sub-label">ENG</span><span>a×10ᵇ</span></div></button>
        <button class="btn btn-func">%</button>
        <button class="btn btn-func">Ans</button>
        
        <!-- Row 5: 数字 7-8-9 ÷ -->
        <button class="btn btn-clear">AC</button>
        <button class="btn btn-num" onclick="press('7')">7</button>
        <button class="btn btn-num" onclick="press('8')">8</button>
        <button class="btn btn-num" onclick="press('9')">9</button>
        <button class="btn btn-op" onclick="press('÷')">÷</button>
        
        <!-- Row 6: 删除 4-5-6 × -->
        <button class="btn btn-func">⌫</button>
        <button class="btn btn-num" onclick="press('4')">4</button>
        <button class="btn btn-num" onclick="press('5')">5</button>
        <button class="btn btn-num" onclick="press('6')">6</button>
        <button class="btn btn-op" onclick="press('×')">×</button>
        
        <!-- Row 7: 负号 1-2-3 - -->
        <button class="btn btn-func">(-)</button>
        <button class="btn btn-num" onclick="press('1')">1</button>
        <button class="btn btn-num" onclick="press('2')">2</button>
        <button class="btn btn-num" onclick="press('3')">3</button>
        <button class="btn btn-op" onclick="press('−')">−</button>
        
        <!-- Row 8: π 0 . + = -->
        <button class="btn btn-func">π</button>
        <button class="btn btn-num" onclick="press('0')">0</button>
        <button class="btn btn-num" onclick="press('.')">.</button>
        <button class="btn btn-op" onclick="press('+')">+</button>
        <button class="btn btn-eq" onclick="calculate()">=</button>
    </div>
</div>

<script>
(function() {
    let expr = '', display = '', result = '0', lastAns = 0, shift = false;
    
    const exprEl = document.getElementById('expression');
    const resEl = document.getElementById('result');
    const shiftEl = document.getElementById('shiftTag');
    
    function toRad(d) { return d * Math.PI / 180; }
    function toDeg(r) { return r * 180 / Math.PI; }
    
    function fmt(n) {
        if (typeof n !== 'number' || !isFinite(n)) return isNaN(n) ? 'Math ERROR' : (n > 0 ? '∞' : '-∞');
        if (Math.abs(n) > 1e15 || (Math.abs(n) < 1e-10 && n !== 0)) return n.toExponential(6);
        return parseFloat(n.toPrecision(10)).toString();
    }
    
    function evalExpr(e) {
        let ex = e
            .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
            .replace(/π/g, String(Math.PI))
            .replace(/sin\(([^)]+)\)/g, (_, a) => Math.sin(toRad(Number(a))))
            .replace(/cos\(([^)]+)\)/g, (_, a) => Math.cos(toRad(Number(a))))
            .replace(/tan\(([^)]+)\)/g, (_, a) => Math.tan(toRad(Number(a))))
            .replace(/log\(([^)]+)\)/g, (_, a) => Math.log10(Number(a)))
            .replace(/ln\(([^)]+)\)/g, (_, a) => Math.log(Number(a)))
            .replace(/√\(/g, 'Math.sqrt(')
            .replace(/\^/g, '**');
        // 隐式乘法
        ex = ex.replace(/(\d)([π])/g, '$1*$2').replace(/(\d)\(/g, '$1*(');
        try { return new Function('return (' + ex + ')')(); }
        catch(e) { return NaN; }
    }
    
    function update() {
        exprEl.textContent = display || ' ';
        resEl.textContent = result;
        resEl.classList.remove('error');
        exprEl.scrollLeft = exprEl.scrollWidth;
        resEl.scrollLeft = resEl.scrollWidth;
    }
    
    window.press = function(val) {
        display += val;
        expr += val;
        // 实时预览
        const preview = evalExpr(expr);
        if (!isNaN(preview) && isFinite(preview)) result = fmt(preview);
        update();
    };
    
    window.calculate = function() {
        const r = evalExpr(expr);
        result = fmt(r);
        if (result === 'Math ERROR') resEl.classList.add('error');
        else lastAns = r;
        expr = result === 'Math ERROR' ? '' : result;
        display = '';
        update();
    };
    
    window.toggleShift = function() {
        shift = !shift;
        shiftEl.className = 'mode-tag' + (shift ? '' : ' off');
    };
    
    // 键盘支持
    document.addEventListener('keydown', e => {
        if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key === '+') press('+');
        else if (e.key === '-') press('−');
        else if (e.key === '*') press('×');
        else if (e.key === '/') { e.preventDefault(); press('÷'); }
        else if (e.key === '.') press('.');
        else if (e.key === 'Enter' || e.key === '=') calculate();
        else if (e.key === 'Backspace') { display = display.slice(0,-1); expr = expr.slice(0,-1); update(); }
        else if (e.key === 'Escape') { display = expr = ''; result = '0'; update(); }
    });
    
    update();
})();
</script>
</body>
</html>
